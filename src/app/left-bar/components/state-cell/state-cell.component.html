<div class="row-center-center">
  <ng-container *ngIf="currentVideoService.get$ | async as currentVideo">
    <ng-container *ngIf="currentVideo.videoId === row.videoId; else control">
      <ng-container *ngIf="playerStateService.get$ | async as state">
        <app-playing-bar [state]="state"></app-playing-bar>
      </ng-container>
    </ng-container>
  </ng-container>

  <ng-template #control>
    <button appButton ghost size="tiny" (click)="onPlay()">
      <i class="fas fa-play"></i>
    </button>
  </ng-template>
</div>
