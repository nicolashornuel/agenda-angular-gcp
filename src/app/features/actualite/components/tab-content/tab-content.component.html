<section class="scrolling row-between-stretch f-wrap cards-container">
  <app-card *ngFor="let card of items" backgroundColor="hsl(0, 0%, 95%)" [isMiniCard]="true">
    <div class="relative h-100">
      <a [href]="card.link" target="_blank">
        <p class="date">{{ card.pubDate | date : 'fullDate' }}</p>
        <img [src]="card.img" (load)="onImageLoad($event)" class="img-placeholder"/>
        <p>{{ card.title }}</p>
      </a>
      <div *ngIf="card.description" class="description">
        <i [appTooltip]="card.description" class="fa-solid fa-ellipsis"></i>
      </div>
    </div>
  </app-card>
</section>
