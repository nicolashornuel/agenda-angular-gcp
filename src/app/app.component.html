<ng-container *ngIf="auth.getUserLoggedIn$ | async">
  <app-navbar isMobile [items]="items" (signOut)="auth.signOut()"></app-navbar>
  <app-alert></app-alert>
  <app-popover></app-popover>
  <app-modal></app-modal>
  <app-audio-handler></app-audio-handler>
  <app-youtube-player></app-youtube-player>
</ng-container>

<router-outlet></router-outlet>

<div *ngIf="loading" class="loading-overlay">
  <app-spinner></app-spinner>
</div>
